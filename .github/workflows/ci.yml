name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - name: Check Conventional Commits title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
          # The subject becomes the changelog line: a sentence starting with a capital letter, no final period.
          # Dependabot writes "ci: bump ..."; its pull requests never reach the changelog, so they are skipped.
          subjectPattern: '^[A-Z].*[^.]$'
          ignoreLabels: dependencies
          subjectPatternError: >-
            The subject "{subject}" must start with a capital letter and have no final period,
            for example: feat: Three-player games were added

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check translations
        if: hashFiles('scripts/i18n_check.py') != ''
        run: python3 scripts/i18n_check.py --quiet

      # The release build is unsigned here; it checks that R8 shrinking still works.
      - name: Lint, test and build
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifepoints-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
