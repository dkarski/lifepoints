name: Release

on:
  push:
    branches: [main]
  # Recovery: build and attach the APK for an existing draft release (for example after a failed APK job).
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release, for example v1.1.0
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    name: Signed APK
    needs: release-please
    if: >-
      !cancelled() && (needs.release-please.outputs.release_created == 'true'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag '$TAG'"; exit 1; }
          DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          # A published release is never rebuilt: its APK may already be installed or uploaded to InkApps.
          [ "$DRAFT" = "true" ] || { echo "::error::$TAG is already published"; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          ./gradlew :app:assembleRelease
          rm -f "$RELEASE_STORE_FILE"

      - name: Verify APK
        env:
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          # Build-tools 35.0.0 (the compileSdk line) when installed, otherwise the newest one.
          BT="$ANDROID_HOME/build-tools/35.0.0"
          [ -x "$BT/apksigner" ] || BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "build-tools: $BT"
          APK="app/build/outputs/apk/release/lifepoints-$VERSION-release.apk"
          test -f "$APK" || { echo "::error::$APK not found (unsigned or wrong version?)"; exit 1; }
          SIGN="$("$BT/apksigner" verify --print-certs "$APK" 2>&1)" || { echo "$SIGN"; echo "::error::apksigner verify failed"; exit 1; }
          echo "$SIGN"
          CERT="$(grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]{64}' <<< "$SIGN" | awk '{print $NF}' || true)"
          [ -n "$EXPECTED_CERT" ] && [ "$CERT" = "$EXPECTED_CERT" ] \
            || { echo "::error::Signing certificate $CERT does not match RELEASE_CERT_SHA256"; exit 1; }
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$((MA * 1000000 + MI * 1000 + PA))
          BADGE="$("$BT/aapt2" dump badging "$APK" | sed -n 1p)"
          echo "$BADGE"
          grep -q "name='dev.dkarski.lifepoints' versionCode='$CODE' versionName='$VERSION'" <<< "$BADGE" \
            || { echo "::error::Expected dev.dkarski.lifepoints $VERSION ($CODE)"; exit 1; }
          mkdir -p out
          cp "$APK" "out/lifepoints-$VERSION.apk"
          (cd out && sha256sum "lifepoints-$VERSION.apk" > "lifepoints-$VERSION.apk.sha256")

      - name: Attach APK and publish the release
        run: |
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
