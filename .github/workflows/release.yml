name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    name: Signed APK
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          ./gradlew :app:assembleRelease
          rm -f "$RELEASE_STORE_FILE"

      - name: Verify APK
        env:
          EXPECTED_CERT: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="app/build/outputs/apk/release/lifepoints-$VERSION-release.apk"
          test -f "$APK" || { echo "::error::$APK not found (unsigned or wrong version?)"; exit 1; }
          CERT="$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          [ -n "$EXPECTED_CERT" ] && [ "$CERT" = "$EXPECTED_CERT" ] \
            || { echo "::error::Signing certificate $CERT does not match RELEASE_CERT_SHA256"; exit 1; }
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$((MA * 1000000 + MI * 1000 + PA))
          BADGE="$("$BT/aapt2" dump badging "$APK" | head -1)"
          echo "$BADGE"
          grep -q "name='dev.dkarski.lifepoints' versionCode='$CODE' versionName='$VERSION'" <<< "$BADGE" \
            || { echo "::error::Expected dev.dkarski.lifepoints $VERSION ($CODE)"; exit 1; }
          mkdir -p out
          cp "$APK" "out/lifepoints-$VERSION.apk"
          (cd out && sha256sum "lifepoints-$VERSION.apk" > "lifepoints-$VERSION.apk.sha256")

      - name: Attach APK and publish the release
        run: |
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
